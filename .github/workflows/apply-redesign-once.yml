name: Apply weather redesign once

on:
  push:
    branches: ["redesign/weather-ui-20260820"]

permissions:
  contents: write

jobs:
  apply-redesign:
    if: "!contains(github.event.head_commit.message, '[redesign-applied]')"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MODERN_HOME_B64: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Apply redesign
        run: |
          echo "$MODERN_HOME_B64" | base64 -d | gunzip > app/src/main/java/com/example/weather/ui/ModernHomeContent.kt
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('app/src/main/java/com/example/weather/ui/HomeScreen.kt')
          s = home.read_text()
          pattern = re.compile(r'    val snapshot = state\.snapshot\n.*?\n    if \(showLocationDialog\) \{', re.S)
          replacement = '''    val snapshot = state.snapshot
              ModernWeatherHomeContent(
                  state = state,
                  onRefresh = onRefresh,
                  onUseDeviceLocation = onUseDeviceLocation,
                  onSelectLocation = onSelectLocation,
                  onOpenLocations = { showLocationDialog = true },
                  onOpenSettings = { showSettingsDialog = true },
                  onDayClick = { selectedDayDate = it.date },
                  onDismissError = onDismissError,
              )

              if (showLocationDialog) {'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'HomeScreen patch count={count}')
          home.write_text(s2)

          main = Path('app/src/main/java/com/example/weather/MainActivity.kt')
          m = main.read_text()
          m = m.replace('containerColor = WeatherPalette.Header,\n                tonalElevation = 0.dp,',
                        'containerColor = MaterialTheme.colorScheme.surface,\n                tonalElevation = 2.dp,')
          m = m.replace('indicatorColor = Color.Transparent,',
                        'indicatorColor = MaterialTheme.colorScheme.primary.copy(alpha = 0.12f),')
          main.write_text(m)

          theme = Path('app/src/main/java/com/example/weather/ui/Theme.kt')
          t = theme.read_text()
          t = t.replace('import androidx.compose.material3.darkColorScheme', 'import androidx.compose.material3.lightColorScheme')
          replacements = {
              '0xFF0B0C0E': '0xFFF4F8FC',
              '0xFF172843': '0xFF173B62',
              '0xFF18191B': '0xFFFFFFFF',
              '0xFF202124': '0xFFFFFFFF',
              '0xFF27282B': '0xFFEAF1F8',
              '0xFF202123': '0xFFFFFFFF',
              '0xFF393A3D': '0xFFDDE6EF',
              '0xFF61C8FF': '0xFF2F7AF8',
              '0xFF5EC7F3': '0xFF4C8FFB',
              '0xFFFFB14A': '0xFFEE8A2B',
              '0xFF7DA9E8': '0xFF6D93D8',
              '0xFF60C9FA': '0xFF2F7AF8',
              '0xFFFF6B67': '0xFFF15A4A',
              '0xFF67A9FF': '0xFF6D93D8',
              '0xFFF4F6FB': '0xFF10233A',
              '0xFFA7B0C4': '0xFF6C7C8E',
              '0xFFFF7A85': '0xFFD94B4B',
              '0xFFFFB74D': '0xFFE88A22',
              '0xFF6FE3A0': '0xFF2EA66B',
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          t = t.replace('extraSmall = RoundedCornerShape(4.dp)', 'extraSmall = RoundedCornerShape(8.dp)')
          t = t.replace('small = RoundedCornerShape(6.dp)', 'small = RoundedCornerShape(12.dp)')
          t = t.replace('medium = RoundedCornerShape(8.dp)', 'medium = RoundedCornerShape(18.dp)')
          t = t.replace('large = RoundedCornerShape(10.dp)', 'large = RoundedCornerShape(24.dp)')
          t = t.replace('extraLarge = RoundedCornerShape(12.dp)', 'extraLarge = RoundedCornerShape(30.dp)')
          t = t.replace('darkColorScheme(', 'lightColorScheme(')
          t = t.replace('onPrimary = Color(0xFF052235)', 'onPrimary = Color.White')
          t = t.replace('listOf(Color(0xFF2E8BE6), Color(0xFF6FB7FF))', 'listOf(Color(0xFF68B5F3), Color(0xFFD9ECFF))')
          t = t.replace('listOf(Color(0xFF3D7CC4), Color(0xFF5C97D6))', 'listOf(Color(0xFF72B3E8), Color(0xFFD3E7F9))')
          t = t.replace('listOf(Color(0xFF394A60), Color(0xFF566379))', 'listOf(Color(0xFF91A9BE), Color(0xFFDCE7F0))')
          theme.write_text(t)
          PY

      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-redesign-once.yml
          git add app/src/main/java/com/example/weather/ui/ModernHomeContent.kt \
                  app/src/main/java/com/example/weather/ui/HomeScreen.kt \
                  app/src/main/java/com/example/weather/ui/Theme.kt \
                  app/src/main/java/com/example/weather/MainActivity.kt
          git commit -m "Refresh weather UI [redesign-applied]"
          git push origin HEAD:redesign/weather-ui-20260820
