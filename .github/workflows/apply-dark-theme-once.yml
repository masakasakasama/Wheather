name: Apply dark theme once

on:
  push:
    branches: ["theme/dark-default-20260821"]

permissions:
  contents: write

jobs:
  apply-dark-theme:
    if: "!contains(github.event.head_commit.message, '[dark-theme-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theme/dark-default-20260821
          fetch-depth: 0

      - name: Apply dark palette
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      print(f"warning: pattern not found in {path}: {old[:80]}")
                  text = text.replace(old, new)
              p.write_text(text)

          replace_all(
              "app/src/main/java/com/example/weather/ui/Theme.kt",
              [
                  ("import androidx.compose.material3.lightColorScheme", "import androidx.compose.material3.darkColorScheme"),
                  ("/** Light, airy palette aligned with the refreshed mobile weather experience. */", "/** Dark-first palette aligned with the refreshed mobile weather experience. */"),
                  ("val Background = Color(0xFFF4F8FC)", "val Background = Color(0xFF0B0F14)"),
                  ("val Header = Color(0xFFFFFFFF)", "val Header = Color(0xFF111821)"),
                  ("val Surface = Color(0xFFFFFFFF)", "val Surface = Color(0xFF111821)"),
                  ("val SurfaceElevated = Color(0xFFFFFFFF)", "val SurfaceElevated = Color(0xFF151D27)"),
                  ("val SurfaceVariant = Color(0xFFEAF1F8)", "val SurfaceVariant = Color(0xFF1B2633)"),
                  ("val ForecastSurface = Color(0xFFFFFFFF)", "val ForecastSurface = Color(0xFF121A24)"),
                  ("val Outline = Color(0xFFDDE6EF)", "val Outline = Color(0xFF2A3948)"),
                  ("val Primary = Color(0xFF2F7AF8)", "val Primary = Color(0xFF5BA2FF)"),
                  ("val Secondary = Color(0xFF4C8FFB)", "val Secondary = Color(0xFF7CB8FF)"),
                  ("val Tertiary = Color(0xFFEE8A2B)", "val Tertiary = Color(0xFFFFB15C)"),
                  ("val Accent = Color(0xFF6D93D8)", "val Accent = Color(0xFF88AEEB)"),
                  ("val Rain = Color(0xFF2F7AF8)", "val Rain = Color(0xFF5BA2FF)"),
                  ("val HighTemperature = Color(0xFFF15A4A)", "val HighTemperature = Color(0xFFFF7D70)"),
                  ("val LowTemperature = Color(0xFF6D93D8)", "val LowTemperature = Color(0xFF8FB5FF)"),
                  ("val OnSurface = Color(0xFF10233A)", "val OnSurface = Color(0xFFF2F7FC)"),
                  ("val OnSurfaceVariant = Color(0xFF6C7C8E)", "val OnSurfaceVariant = Color(0xFF9BAFC2)"),
                  ("val Danger = Color(0xFFD94B4B)", "val Danger = Color(0xFFFF6B6B)"),
                  ("val Warning = Color(0xFFE88A22)", "val Warning = Color(0xFFFFB454)"),
                  ("val Good = Color(0xFF2EA66B)", "val Good = Color(0xFF55D58A)"),
                  ("colorScheme = lightColorScheme(", "colorScheme = darkColorScheme("),
                  ("onPrimary = Color.White,", "onPrimary = Color(0xFF071522),"),
                  ("isNight -> listOf(Color(0xFF21365D), Color(0xFF101C38))", "isNight -> listOf(Color(0xFF172C4A), Color(0xFF090F1B))"),
                  ("weatherCode == 0 -> listOf(Color(0xFF65B4F2), Color(0xFFD9ECFF))", "weatherCode == 0 -> listOf(Color(0xFF173A5C), Color(0xFF0D1E32))"),
                  ("weatherCode in listOf(1, 2) -> listOf(Color(0xFF72B3E8), Color(0xFFD3E7F9))", "weatherCode in listOf(1, 2) -> listOf(Color(0xFF18364F), Color(0xFF0D1B2A))"),
                  ("weatherCode == 3 -> listOf(Color(0xFF91A9BE), Color(0xFFDCE7F0))", "weatherCode == 3 -> listOf(Color(0xFF273746), Color(0xFF111A22))"),
                  ("weatherCode in listOf(45, 48) -> listOf(Color(0xFF9EADB9), Color(0xFFE0E8EE))", "weatherCode in listOf(45, 48) -> listOf(Color(0xFF303941), Color(0xFF151A1F))"),
                  ("listOf(Color(0xFF6F91B5), Color(0xFFD2E2F0))", "listOf(Color(0xFF17314B), Color(0xFF0D1824))"),
                  ("weatherCode in listOf(71, 73, 75, 77, 85, 86) -> listOf(Color(0xFFA7BACD), Color(0xFFE7F0F7))", "weatherCode in listOf(71, 73, 75, 77, 85, 86) -> listOf(Color(0xFF29435A), Color(0xFF12202B))"),
                  ("weatherCode in listOf(95, 96, 99) -> listOf(Color(0xFF626C87), Color(0xFFC9D0DF))", "weatherCode in listOf(95, 96, 99) -> listOf(Color(0xFF2F3147), Color(0xFF11121D))"),
                  ("else -> listOf(Color(0xFF65B4F2), Color(0xFFD9ECFF))", "else -> listOf(Color(0xFF173A5C), Color(0xFF0D1E32))"),
              ],
          )

          replace_all(
              "app/src/main/java/com/example/weather/ui/RedesignedHomeScreen.kt",
              [
                  ("private val RedesignBlue = Color(0xFF2F7AF8)", "private val RedesignBlue = Color(0xFF5BA2FF)"),
                  ("private val RedesignText = Color(0xFF10233A)", "private val RedesignText = Color(0xFFF2F7FC)"),
                  ("private val RedesignMuted = Color(0xFF6C7C8E)", "private val RedesignMuted = Color(0xFF9BAFC2)"),
                  ("private val RedesignCard = Color.White", "private val RedesignCard = Color(0xFF121A24)"),
                  ("private val RedesignSoftBlue = Color(0xFFEAF3FF)", "private val RedesignSoftBlue = Color(0xFF17283B)"),
                  ("private val RedesignSoftGreen = Color(0xFFEAF8F0)", "private val RedesignSoftGreen = Color(0xFF142A22)"),
                  ("private val RedesignGreen = Color(0xFF2EA66B)", "private val RedesignGreen = Color(0xFF55D58A)"),
                  ("private val RedesignSoftPurple = Color(0xFFF1EDFF)", "private val RedesignSoftPurple = Color(0xFF211C37)"),
                  ("private val RedesignPurple = Color(0xFF6B55DF)", "private val RedesignPurple = Color(0xFFA99BFF)"),
                  ("private val RedesignRed = Color(0xFFF15A4A)", "private val RedesignRed = Color(0xFFFF7D70)"),
                  ("private val RedesignLow = Color(0xFF6D93D8)", "private val RedesignLow = Color(0xFF8FB5FF)"),
                  ("containerColor = Color(0xFFFFEEEE)", "containerColor = Color(0xFF3A1E22)"),
                  ("containerColor = Color(0xFFFFF0ED)", "containerColor = Color(0xFF351C1E)"),
                  ("listOf(Color(0xFF65B4F2), Color(0xFFD8ECFF))", "listOf(Color(0xFF163454), Color(0xFF0B1726))"),
                  ("background = if (radar?.isRaining() == true) Color(0xFFFFF1EA) else RedesignSoftGreen", "background = if (radar?.isRaining() == true) Color(0xFF38211D) else RedesignSoftGreen"),
                  ("background(Color.White.copy(alpha = 0.72f))", "background(Color(0xFF0C141D).copy(alpha = 0.78f))"),
                  ("drawCircle(Color.White, radius = 1.2.dp.toPx(), center = point)", "drawCircle(Color(0xFFEAF3FF), radius = 1.2.dp.toPx(), center = point)"),
                  ("background(Color.White.copy(alpha = 0.75f))", "background(Color(0xFF0C141D).copy(alpha = 0.82f))"),
              ],
          )

          replace_all(
              "app/src/main/java/com/example/weather/ui/RadarScreen.kt",
              [
                  ("private val RadarBlue = Color(0xFF2F7AF8)", "private val RadarBlue = Color(0xFF5BA2FF)"),
                  ("private val RadarText = Color(0xFF10233A)", "private val RadarText = Color(0xFFF2F7FC)"),
                  ("private val RadarMuted = Color(0xFF6C7C8E)", "private val RadarMuted = Color(0xFF9BAFC2)"),
                  ("private val RadarSoftBlue = Color(0xFFEAF3FF)", "private val RadarSoftBlue = Color(0xFF17283B)"),
                  ("containerColor = Color.White", "containerColor = Color(0xFF121A24)"),
                  ("containerColor = Color(0xFFFFEEEE)", "containerColor = Color(0xFF3A1E22)"),
                  ("background(Color.White.copy(alpha = 0.92f))", "background(Color(0xFF101820).copy(alpha = 0.94f))"),
                  ("background(Color.White.copy(alpha = 0.9f))", "background(Color(0xFF101820).copy(alpha = 0.94f))"),
                  ("background(Color(0xFFF2F5F7))", "background(Color(0xFF0C1219))"),
                  ("background(Color.White)", "background(Color(0xFF121A24))"),
                  ("background(Color.White.copy(alpha = 0.92f))", "background(Color(0xFFE7F1FB).copy(alpha = 0.90f))"),
              ],
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/weather/ui/Theme.kt app/src/main/java/com/example/weather/ui/RedesignedHomeScreen.kt app/src/main/java/com/example/weather/ui/RadarScreen.kt
          git commit -m "Switch weather UI to dark theme [dark-theme-applied]"
          git push origin theme/dark-default-20260821
