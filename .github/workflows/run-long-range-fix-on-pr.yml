name: Run long range fix on PR

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/long-range-rain-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/long-range-rain-20260821
          fetch-depth: 0
      - name: Execute one-time patch
        shell: bash
        run: |
          if [ ! -f .github/workflows/apply-long-range-fix-once.yml ]; then
            echo "Patch already applied"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-long-range-fix-once.yml')
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |') + 1
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:]) + '\n'
          Path('/tmp/apply-long-range-fix.sh').write_text(script)
          PY
          bash /tmp/apply-long-range-fix.sh
